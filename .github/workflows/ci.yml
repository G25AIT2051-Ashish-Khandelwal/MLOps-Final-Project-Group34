name: CI Pipeline

on:
  push:
    branches: [ main, somnath ]
  pull_request:
    branches: [ main, somnath ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest black flake8

    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Format check with black
      run: |
        black --check src/ || true

    - name: Run tests (if available)
      run: |
        pytest tests/ -v || echo "No tests found"

    - name: Validate data preparation script
      run: |
        python -m py_compile src/data_prep.py

    - name: Validate training script
      run: |
        python -m py_compile src/train.py

    - name: Validate inference script
      run: |
        python -m py_compile src/inference.py
